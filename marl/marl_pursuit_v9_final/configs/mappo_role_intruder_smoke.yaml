env:
  map_size: 20.0
  map_half: 10.0
  n_agents: 2
  obs_dim: 46
  agent_lidar_rays: 32
  agent_lidar_range: 12.0
  max_steps: 200
  dt: 0.1
  capture_radius: 1.5
  agent_max_speed: 1.5
  intruder_speed: 1.2
  intruder_max_offset: 2.0
  intruder_lidar_rays: 32
  intruder_lidar_range: 12.0
  agent_radius: 0.3
  grid_resolution: 0.5
  use_roles: true
  role_cooldown_steps: 30
  role_gap_threshold: 1.0

mappo:
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  n_epochs: 4
  rollout_steps: 256
  mini_batch_size: 64
  entropy_coeff: 0.01
  value_loss_coeff: 0.5
  max_grad_norm: 0.5
  total_timesteps: 4_000
  eval_interval: 10_000
  save_interval: 100_000
  use_intruder_policy: true
  intruder_obs_dim: 44
  intruder_lr_actor: 3.0e-4
  intruder_lr_critic: 3.0e-4
  intruder_hybrid_prob_start: 0.5
  intruder_hybrid_prob_end: 0.1
  intruder_hybrid_decay_frac: 0.5

reward:
  w_dist_pursuer: 1.5
  w_pin_pursuer: 2.0
  w_lag_pursuer: -0.5
  pin_threshold: 2.0
  lag_threshold: 5.0
  w_angle_encircler: 3.0
  w_cutoff_encircler: 1.5
  w_dist_encircler: 0.3
  w_capture: 200.0
  w_time: 100.0
  w_proximity: -0.5
  separation_threshold: 1.5
  w_step: -0.05
  w_intruder_alive: 0.05
  w_intruder_distance: 0.5
  w_intruder_captured: -100.0
  w_intruder_wall: -0.1
